[package]
name = "kal-rrd-graph"
version = "%%version%%"
edition = "2021"
rust-version = "1.82"
description = "Describe, fetch, watch and serve one YAML-configured RRD graph"
license = "MIT"
authors = ["Valentin Lab <valentin.lab@kalysto.org>"]
repository = "https://github.com/0k/kal-rrd-graph"
readme = "README.md"
keywords = ["rrd", "rrdtool", "time-series", "graph", "sse"]
categories = ["visualization", "web-programming::http-server"]
exclude = [
    "AGENTS.md",
    "CLAUDE.md",
    "CLAUDE.local.md",
    "README.org",
    "autogen.sh",
    ".gitchangelog.rc",
    ".gitignore",
    ".package.d/",
    ".pkg/",
]

[dependencies]
rrd = "0.3.1"
kal-fs-watch = "0.1"
kal-sse = { version = "0.2", features = ["axum"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
thiserror = "2"
axum = "0.8"
futures-core = "0.3"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
indoc = "2"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace]
